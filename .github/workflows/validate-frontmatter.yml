name: Validate Frontmatter

on:
  pull_request:
    paths:
      - 'plugins/**/agents/*.md'
      - 'plugins/**/skills/*/SKILL.md'
      - 'plugins/**/commands/*.md'
      - '.github/workflows/validate-frontmatter.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/**'
  workflow_dispatch:

jobs:
  # PR: validate only the frontmatter files this PR touches (fast feedback).
  validate-changed:
    # Fork PRs come from untrusted repos: their filenames must never reach the
    # shell steps below. Fork PRs are expected to be closed by
    # close-external-prs.yml, so skip validation for them entirely.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 (sha-pinned)

      - name: Install dependencies
        run: cd .github/scripts && bun install

      - name: Get changed frontmatter files
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Use diff-filter=AMRC to exclude deleted files (D) - only Added, Modified, Renamed, Copied
          FILES=$(gh pr diff "$PR_NUMBER" --name-only --diff-filter=AMRC | grep -E '(agents/.*\.md|skills/.*/SKILL\.md|commands/.*\.md)$' || true)
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Validate frontmatter
        if: steps.changed.outputs.files != ''
        env:
          FILES: ${{ steps.changed.outputs.files }}
        run: |
          printf '%s\n' "$FILES" | xargs bun .github/scripts/validate-frontmatter.ts

  # push / dispatch: full sweep of every vendored plugin.
  validate-all:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 (sha-pinned)

      - name: Install dependencies
        run: cd .github/scripts && bun install

      - name: Validate all frontmatter
        run: bun .github/scripts/validate-frontmatter.ts plugins
